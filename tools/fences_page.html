<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>经销商围栏 × 行政区划边界</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
 html,body{margin:0;height:100%;font:13px/1.5 -apple-system,"PingFang SC",sans-serif}
 #wrap{display:flex;height:100%}
 #side{width:280px;overflow-y:auto;border-right:1px solid #ddd;padding:10px;box-sizing:border-box}
 #side h3{margin:4px 0 8px;font-size:15px}
 #search{width:100%;box-sizing:border-box;padding:5px 8px;margin-bottom:8px;border:1px solid #ccc;border-radius:6px}
 .dl{padding:6px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .dl:hover{background:#f0f4fa}
 .dl.on{background:#1a73e8;color:#fff}
 .dl small{opacity:.7;margin-left:4px}
 #map{flex:1}
 #info{position:absolute;top:10px;right:10px;z-index:1000;background:#fffce0;border:1px solid #e0d68a;
       border-radius:8px;padding:10px 14px;max-width:340px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12.5px}
 #info h4{margin:0 0 6px;font-size:14px}
 #info .fb{margin:2px 0}
 #info .tag{color:#1a73e8;font-weight:600}
 #ctrl{position:absolute;bottom:14px;right:10px;z-index:1000;background:#fff;border-radius:8px;
       padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12.5px}
 #ctrl label{display:block;cursor:pointer;margin:2px 0}
 .legend{margin-top:4px;color:#666;font-size:11px}
</style>
</head>
<body>
  <div id="side">
    <h3>经销商（37）</h3>
    <input id="search" placeholder="搜索经销商…">
    <div id="list"></div>
  </div>
  <div id="map" style="position:relative">
    <div id="info" style="display:none"></div>
    <div id="ctrl">
      <label><input type="checkbox" id="ckSub" checked> 街道/乡镇界（紫点线）</label>
      <label><input type="checkbox" id="ckAdmin" checked> 区界线（OSM 碎片）</label>
      <label><input type="checkbox" id="ckOthers"> 其他经销商围栏</label>
      <label><input type="checkbox" id="ckStores" checked> 门店（按区着色）</label>
      <div class="legend">虚线=行政边界 · 实线填充=当前围栏 · ○=门店</div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let DATA, layers = {me:null, others:L.layerGroup(), admin:L.layerGroup(),
                    sub:L.layerGroup(),
                    stores:L.layerGroup(), center:null}, cur = -1;
const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {maxZoom: 18, attribution: '© OSM'}).addTo(map);
const DCOLORS = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#46f0f0","#f032e6",
                 "#bcf60c","#fabebe","#008080","#9a6324","#800000"];
fetch('/api/fences').then(r=>r.json()).then(d=>{
  DATA = d;
  // admin lines
  for (const [name, polys] of Object.entries(d.admin))
    for (const p of polys)
      if (p.length >= 2)
        L.polyline(p.map(q=>[q[1],q[0]]), {color:'#0d47a1', weight:5, dashArray:'10 6',
                    opacity:.95}).bindTooltip('⚑ '+name, {sticky:true}).addTo(layers.admin);
  layers.admin.addTo(map);
  for (const [name, polys] of Object.entries(d.subdistricts || {}))
    for (const p of polys)
      if (p.length >= 2)
        L.polyline(p.map(q=>[q[1],q[0]]), {color:'#7b1fa2', weight:2.5, dashArray:'2 5',
                    opacity:.9}).bindTooltip('▫ '+name, {sticky:true}).addTo(layers.sub);
  layers.sub.addTo(map);
  // others
  d.dealers.forEach((de,i)=>{
    de.rings.forEach(r=>L.polygon(r.map(q=>[q[1],q[0]]), {color:'#888', weight:1, fill:false})
        .bindTooltip(de.name).addTo(layers.others));
  });
  // list
  const list = document.getElementById('list');
  d.dealers.forEach((de,i)=>{
    const el = document.createElement('div');
    el.className='dl'; el.textContent = de.name;
    el.innerHTML += `<small>${de.area_km2}km²·${de.store_count}店</small>`;
    el.onclick = ()=>select(i);
    el.dataset.name = de.name;
    list.appendChild(el);
  });
  document.getElementById('search').oninput = e=>{
    [...list.children].forEach(el=>el.style.display =
        !q || el.dataset.name.includes(q) ? '' : 'none');
  };
  fitAll();
});
document.getElementById('ckAdmin').onchange = e=>{
  e.target.checked ? map.addLayer(layers.admin) : map.removeLayer(layers.admin);};
document.getElementById('ckOthers').onchange = e=>{
  e.target.checked ? map.addLayer(layers.others) : map.removeLayer(layers.others);};
document.getElementById('ckStores').onchange = e=>{
  e.target.checked ? map.addLayer(layers.stores) : map.removeLayer(layers.stores);};
document.getElementById('ckSub').onchange = e=>{
  e.target.checked ? map.addLayer(layers.sub) : map.removeLayer(layers.sub);};

function fitAll(){
  const b = [];
  for (const polys of Object.values(DATA.admin)) for (const p of polys)
    for (const q of p) b.push([q[1],q[0]]);
  map.fitBounds(b);
}
function select(i){
  cur = i;
  [...document.getElementById('list').children]
    .forEach((el,j)=>el.classList.toggle('on', j===i));
  if (layers.me) map.removeLayer(layers.me);
  if (layers.center) map.removeLayer(layers.center);
  map.removeLayer(layers.stores); layers.stores = L.layerGroup();
  const de = DATA.dealers[i];
  const col = DCOLORS[i % DCOLORS.length];
  layers.me = L.layerGroup();
  de.rings.forEach(r=>L.polygon(r.map(q=>[q[1],q[0]]),
      {color:col, weight:3, fillOpacity:.12}).addTo(layers.me));
  layers.me.addTo(map);
  if (de.center.length)
    layers.center = L.circleMarker([de.center[1],de.center[0]],
      {radius:6,color:'#000',fillColor:'#fff',fillOpacity:1,weight:2})
      .bindTooltip('中心点').addTo(map);
  const dset = {};
  de.stores.forEach(s=>{
    (dset[s.d] = dset[s.d] || []).push(s);
    L.circleMarker([s.lat,s.lon],{radius:3.5,weight:1,color:'#333',fillOpacity:.9,
        fillColor:DCOLORS[Object.keys(dset).indexOf(s.d)%DCOLORS.length]})
      .bindTooltip(s.d).addTo(layers.stores);
  });
  if (document.getElementById('ckStores').checked) layers.stores.addTo(map);
  // info panel
  const fb = de.four_bounds || {};
  const dist = Object.entries(dset).sort((a,b)=>b[1].length-a[1].length)
      .map(([k,v])=>`${k}:${v.length}`).join(' ');
  document.getElementById('info').style.display='';
  document.getElementById('info').innerHTML =
    `<h4>${i+1}. ${de.name}</h4>`+
    `<div class="fb">面积 ${de.area_km2} km² · 门店 ${de.store_count} 家 · 合同主体区 ${de.district||'—'}</div>`+
    `<div class="fb legend">门店分布（区:数）: ${dist}</div>`+
    Object.entries(fb).map(([k,v])=>
      `<div class="fb"><span class="tag">${k}</span> ${v||'—'}</div>`).join('');
  const b = [];
  de.rings.forEach(r=>r.forEach(q=>b.push([q[1],q[0]])));
  map.fitBounds(b, {padding:[40,40]});
}
</script>
</body>
</html>
