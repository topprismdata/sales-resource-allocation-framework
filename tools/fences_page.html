<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>经销商围栏 × 行政区划边界</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
 html,body{margin:0;height:100%;font:13px/1.5 -apple-system,"PingFang SC",sans-serif}
 #wrap{display:flex;height:100%}
 #side{width:280px;overflow-y:auto;border-right:1px solid #ddd;padding:10px;box-sizing:border-box}
 #side h3{margin:4px 0 8px;font-size:15px}
 #search{width:100%;box-sizing:border-box;padding:5px 8px;margin-bottom:8px;border:1px solid #ccc;border-radius:6px}
 .dl{padding:6px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .dl:hover{background:#f0f4fa}
 .dl.on{background:#1a73e8;color:#fff}
 .dl small{opacity:.7;margin-left:4px}
 #map{flex:1}
 #info{position:absolute;top:10px;right:10px;z-index:1000;background:#fffce0;border:1px solid #e0d68a;
       border-radius:8px;padding:10px 14px;max-width:340px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12.5px}
 #info h4{margin:0 0 6px;font-size:14px}
 #info .fb{margin:2px 0}
 #info .tag{color:#1a73e8;font-weight:600}
 #ctrl{position:absolute;bottom:14px;right:10px;z-index:1000;background:#fff;border-radius:8px;
       padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12.5px}
 #ctrl label{display:block;cursor:pointer;margin:2px 0}
 .legend{margin-top:4px;color:#666;font-size:11px}
 .leaflet-tile-pane{filter:grayscale(1) brightness(1.05)}
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <h3 id="dcount">经销商</h3>
    <input id="search" placeholder="搜索经销商…">
    <div id="list"></div>
  </div>
  <div id="map" style="position:relative">
    <div id="info" style="display:none"></div>
    <div id="ctrl">
      <label><input type="checkbox" id="ckSub" checked> 街道/乡镇界（紫点线）</label>
      <label><input type="checkbox" id="ckAdmin" checked> 区界线（深蓝粗虚线）</label>
      <label><input type="checkbox" id="ckTruth" checked> 真实围栏（当前经销商）</label>
      <label><input type="checkbox" id="ckRecon" checked> 描述重建（绿，亨啡源北）</label>
      <label><input type="checkbox" id="ckYed" checked> 业代片区·海珠荔湾（橙）</label>
      <div class="legend">实线填充=当前围栏</div>
      <div class="legend" id="ver">页面 v15 · 数据未知</div>
    </div>
    <div id="yedbox" style="position:absolute;bottom:14px;left:10px;z-index:1000;background:#fff;
         border-radius:8px;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12.5px;width:420px">
      <b>业代围栏调整</b>
      <div id="ychips" style="margin:4px 0">
        <span class="chip" style="background:#f4f6f8;border-radius:10px;padding:1px 8px;cursor:pointer">@海珠荔湾02 和 @海珠荔湾03 合并</span>
        <span class="chip" style="background:#f4f6f8;border-radius:10px;padding:1px 8px;cursor:pointer">拆分 @海珠荔湾05 沿 珠江</span>
      </div>
      <input id="ycmd" placeholder="输入 @ 唤起业代片区，例：@海珠荔湾02 和 @海珠荔湾03 合并"
             style="width:100%;box-sizing:border-box;padding:5px 8px;border:1px solid #ccc;border-radius:6px">
      <div style="margin-top:5px;display:flex;gap:6px;align-items:center">
        <button id="ybtn" style="padding:3px 12px;border:1px solid #1a73e8;background:#e8f0fe;border-radius:6px;cursor:pointer">调整</button>
        <button id="yapply" style="padding:3px 12px;border:1px solid #188038;background:#e6f4ea;border-radius:6px;cursor:pointer">应用落盘</button>
        <button id="yreset" style="padding:3px 12px;border:1px solid #999;border-radius:6px;cursor:pointer">还原</button>
        <span id="ymeg" style="color:#1a73e8"></span>
      </div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DCOLORS = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#46f0f0","#f032e6",
                 "#bcf60c","#fabebe","#008080","#9a6324","#800000"];
const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {maxZoom: 18, attribution: '© OSM'}).addTo(map);
let DATA, cur = -1;
const layers = {
  admin: L.layerGroup(), sub: L.layerGroup(),
  me: null, center: null, recon: null
};
fetch('/api/fences').then(r=>r.json()).then(d=>{
  DATA = d;
  document.getElementById('dcount').textContent = `经销商（${d.dealers.length}）`;
  // 区界（深蓝粗虚线）
  for (const [name, polys] of Object.entries(d.admin))
    for (const p of polys)
      if (p.length >= 2)
        L.polyline(p.map(q=>[q[1],q[0]]), {color:'#0d47a1', weight:5, dashArray:'10 6',
            opacity:.95}).bindTooltip('⚑ '+name, {sticky:true}).addTo(layers.admin);
  layers.admin.addTo(map);
  // 街道界（紫点线）
  for (const [name, polys] of Object.entries(d.subdistricts || {}))
    for (const p of polys)
      if (p.length >= 2)
        L.polyline(p.map(q=>[q[1],q[0]]), {color:'#7b1fa2', weight:4.5, dashArray:'2 5',
            opacity:.95}).bindTooltip('▫ '+name, {sticky:true}).addTo(layers.sub);
  layers.sub.addTo(map);
  // 业代片区（橙）
  const yeLayers = L.layerGroup();
  fetch('/api/yeidai').then(r=>r.json()).then(d=>{
    const DC = ["#e67e22","#f1c40f","#8e44ad","#16a085","#c0392b","#2980b9",
                "#27ae60","#d35400","#7f8c8d","#2c3e50","#e84393"];
    d.zones.forEach((z,i)=>{
      L.polygon(z.ring.map(q=>[q[1],q[0]]),
        {color:DC[i%DC.length],weight:2,fillColor:DC[i%DC.length],fillOpacity:.18})
        .bindTooltip(`业代 ${z.name} (${z.area}km²)`,{sticky:true}).addTo(yeLayers);
    });
    yeLayers.addTo(map);
  });
  document.getElementById('ckYed').onchange = e=>{
    e.target.checked ? map.addLayer(yeLayers) : map.removeLayer(yeLayers);
  };
  // 业代命令
  const ycmd=document.getElementById('ycmd'), ymeg=document.getElementById('ymeg');
  let zoneNames=[];
  fetch('/api/yeidai').then(r=>r.json()).then(d=>{zoneNames=d.zones.map(z=>z.name);});
  ycmd.addEventListener('input',()=>{
    const v=ycmd.value; const m=v.match(/@([^@\s，。；、,;]*)$/);
    if(!m){return;}
    const q=m[1];
    const hit=zoneNames.find(n=>n.includes(q));
    if(hit){
      ycmd.value=v.slice(0,v.length-q.length)+hit+' ';
    }
  });
  async function yePost(url){
    ymeg.textContent='…';
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:ycmd.value})});
    const d=await r.json();
    ymeg.textContent=d.message||d.error||'';
    if(d.zones){
      yeLayers.clearLayers();
      d.zones.forEach((z,i)=>{
        L.polygon(z.ring.map(q=>[q[1],q[0]]),
          {color:'#e67e22',weight:2,fillColor:'#e67e22',fillOpacity:.18,
           dashArray: url.includes('adjust')?'4 4':null})
          .bindTooltip(`业代 ${z.name} (${z.area}km²)`,{sticky:true}).addTo(yeLayers);
      });
    }
  }
  document.getElementById('ybtn').onclick=()=>yePost('/api/yeidai_adjust');
  document.getElementById('yapply').onclick=()=>yePost('/api/yeidai_apply');
  document.getElementById('yreset').onclick=async()=>{
    const r=await fetch('/api/yeidai_reset',{method:'POST'});
    const d=await r.json(); ymeg.textContent=d.message;
    yeLayers.clearLayers(); location.reload();
  };
  // 列表
  const list = document.getElementById('list');
  d.dealers.forEach((de,i)=>{
    const el = document.createElement('div');
    el.className='dl'; el.dataset.name = de.name;
    el.innerHTML = `${de.name}<small>${de.area_km2}km²·${de.store_count}店</small>`;
    el.onclick = ()=>select(i);
    list.appendChild(el);
  });
  document.getElementById('search').oninput = e=>{
    const q = e.target.value.trim();
    [...list.children].forEach(el=>el.style.display =
        !q || el.dataset.name.includes(q) ? '' : 'none');
  };
  fitAll();
  if (document.getElementById('ckRecon').checked) loadRecon();
});
function fitAll(){
  const b = [];
  for (const polys of Object.values(DATA.admin)) for (const p of polys)
    for (const q of p) b.push([q[1],q[0]]);
  map.fitBounds(b);
}
function select(i){
  cur = i;
  [...document.getElementById('list').children]
    .forEach((el,j)=>el.classList.toggle('on', j===i));
  if (layers.me) map.removeLayer(layers.me);
  if (layers.center) map.removeLayer(layers.center);
  const de = DATA.dealers[i];
  const col = DCOLORS[i % DCOLORS.length];
  if (layers.me) map.removeLayer(layers.me);
  layers.me = L.layerGroup();
  de.rings.forEach(r=>L.polygon(r.map(q=>[q[1],q[0]]),
      {color:col, weight:3, fillOpacity:.12}).addTo(layers.me));
  layers.me.addTo(map);
  if (de.center.length)
    layers.center = L.circleMarker([de.center[1],de.center[0]],
      {radius:6,color:'#000',fillColor:'#fff',fillOpacity:1,weight:2})
      .bindTooltip('中心点').addTo(map);
  const fb = de.four_bounds || {};
  document.getElementById('info').style.display='';
  document.getElementById('info').innerHTML =
    `<h4>${i+1}. ${de.name}</h4>`+
    `<div class="fb">面积 ${de.area_km2} km² · 门店 ${de.store_count} 家 · 合同主体区 ${de.district||'—'}</div>`+
    Object.entries(fb).map(([k,v])=>
      `<div class="fb"><span class="tag">${k}</span> ${v||'—'}</div>`).join('');
  const b = [];
  de.rings.forEach(r=>r.forEach(q=>b.push([q[1],q[0]])));
  map.fitBounds(b, {padding:[40,40]});
}
function toggle(id, layer){
  document.getElementById(id).onchange = e=>{
    e.target.checked ? map.addLayer(layer) : map.removeLayer(layer);
  };
}
document.getElementById('ckTruth').onchange = e=>{
  if (!e.target.checked) { if (layers.me) map.removeLayer(layers.me); }
  else if (layers.me) map.addLayer(layers.me);
};
toggle('ckAdmin', layers.admin);
toggle('ckSub', layers.sub);
// 描述重建对比（按需加载）
function loadRecon(){
  if (layers.recon) { map.addLayer(layers.recon); return; }
  fetch('/api/north_desc').then(r=>r.json()).then(d=>{
    document.getElementById('ver').textContent =
      `页面 v15 · 重建数据 ${Object.keys(d).join('/')} · 绿块${d.roadB ? d.roadB.length : '?'}点`;
    layers.recon = L.layerGroup();
    L.polygon(d.roadB.map(q=>[q[1],q[0]]),
        {color:'#1b5e20',weight:4,dashArray:'6 5',fillColor:'#2e7d32',fillOpacity:.85})
      .bindTooltip('描述重建（道路链，IoU 0.897）',{sticky:true}).addTo(layers.recon);
    L.polyline(d.cutline.map(q=>[q[1],q[0]]),
        {color:'#1b5e20',weight:1.5,opacity:.6,dashArray:'1 4'}).addTo(layers.recon);
    map.addLayer(layers.recon);
  });
}
document.getElementById('ckRecon').onchange = e=>{
  if (!e.target.checked) {
    if (layers.recon) map.removeLayer(layers.recon);
  } else loadRecon();
};
</script>
</body>
</html>
