name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Hermetic Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install (git-tag pinned deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run hermetic pytest (local_data excluded via addopts)
        run: pytest tests -q

      - name: Import smoke (packaging contract)
        run: |
          python -c "import dealer_territory, intelligence"
          python -c "from intelligence.coords import wgs2gcj; assert abs(wgs2gcj(113.2644,23.1291)[0]-113.2644)>1e-9"
